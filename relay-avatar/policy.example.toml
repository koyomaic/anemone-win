# relay-avatar 策略配置（权限/约束/安全唯一真源，两入口共读）
# 部署位：$AVATAR_STATE_DIR/policy.toml（provision 首装从本模板拷贝，之后本机演进不覆盖）
# 铁律：凭据一律走 env 文件（shared/secrets/relay-avatar.env，600），本文件不出现任何密钥。

[identity]
avatar_name = "智微办"
owner_name = "王洪彬"
owner_userid = "18434"
# 本机 dws 登录账号的 openDingTalkId（`dws contact user me` 查询）——机队各机
# 用自己的 dws 认证，此值必须按本机账号填；用于过滤本账号自发消息（self-loop 双保险）
self_open_id = ""
# 多账号机必填（所有 dws 调用强制 --profile）；单账号机留空=本机默认登录态
dws_profile = ""
# 出站消息末尾署名（可空）；SELF_MARK 隐形标识另由程序维护，不在此配
sign = ""

[ingress]
# 群@ 事件（user_im_message_receive_at）仅在 [group] enabled=true 时订阅
event_keys = ["user_im_message_receive_o2o_all"]
idle_watchdog_sec = 270        # 事件流空闲多久强制重连（钉钉长连接 ~300s 静默断）
debounce_sec = 20              # 聚合窗口
followup_debounce_sec = 30     # 任务结束后追问聚合窗口
session_ttl_sec = 1800         # 会话上下文（resume_from）有效期
poll_sec = 3                   # relay 任务状态轮询间隔
result_max_chars = 3000        # 结果超长截断，全文走附件
ack_emoji = "奋斗"              # 收到回执兜底表情（文字表情未配置/失败时用）
submit_emoji = ""              # 提交回执：留空=不贴（开流式卡片即是回执，不再莫名点「赞」）
noise_emoji = "打招呼"          # 寒暄/噪音消息的轻回执
followup_emoji = "OK"          # 任务运行中收到补充消息的回执
use_card = true                # 流式卡片：提交即开卡「正在处理」，状态跳变更新，完成定格结果
card_progress_sec = 30         # 运行中卡片进度刷新节流（秒）
noise_ignore = ["你好", "您好", "在吗", "在么", "hi", "hello", "嗯", "嗯嗯",
                "好的", "好", "收到", "ok", "OK", "谢谢", "多谢", "辛苦了", "测试"]
self_poll = false              # P2：轮询本人单聊（账号自发消息不进事件流）
self_poll_interval_sec = 5

[ingress.ack_text_emotion]
# 收到回执首选：钉钉文字表情（贴原消息的小图标，显示自定义文字）。
# 文字表情模板**机队共用**（同组织内 ID 通用；各机 dws 认证独立但直接用即可）。
# 如需新模板：`dws chat message create-text-emotion --emotion-name 马上办
# --text "收到啦，马上为你办～"`，背景色由服务端分配（--background-id 仅参考），
# 多摇几次直到三态底色互不相同。ID 无效时自动回落 ack_emoji，不影响主流程。
# 三态三色约定：处理中 im_bg_1 / 办妥 im_bg_3 / 出错 im_bg_5，一眼可辨。
# 注意：TOML 子表必须放在 [ingress] 全部简单键之后，否则后续键会被卷进子表。
emotion_id = "23494072"
emotion_name = "马上办"
text = "收到啦，马上为你办～"
background_id = "im_bg_1"

[ingress.done_text_emotion]
# 完成态换图标：撤「马上办」贴「办妥啦」（不同模板=不同背景色，一眼区分终态）
emotion_id = "23482558"
emotion_name = "办妥啦"
text = "办妥啦，请查收～"
background_id = "im_bg_3"

[ingress.fail_text_emotion]
# 失败态换图标
emotion_id = "23491095"
emotion_name = "出错了"
text = "❌ 出错了"
background_id = "im_bg_5"

[keywords]
submit = ["提交", "开始执行"]
cancel = ["取消"]
confirm = ["确认", "同意"]
deny = ["拒绝", "不同意"]
conflict = ["冲突"]

[group]
enabled = false                # 群@监听默认关；开启需显式改本文件（决策留痕）

[permissions]
default_mode = "whitelist"     # whitelist=名单外一律 guest（空名单即除 super 外全拒）；blacklist 需显式配置
guest_mode = "silent"          # 名单外处置：silent=彻底静默忽略（不回话不建会话，默认，防与自动回复 bot 互刷死循环）；
                               # guide=自我介绍+引导「申请授权/申请传文件」审批流（同人 1h 只引导一次）
superadmin = ["18434"]         # super：全权 + 审批动态白名单
admins = []                    # L1：管理员
whitelist = []                 # L2：静态白名单
blacklist = []                 # BLOCKED
file_uploaders = []            # L3 静态：只能传文件+就自己文件问答
grant_valid_days = 90          # 动态授权强制过期天数（修 fenshen P1 无过期）

[execution]
default_backend = "relay"      # 主执行走 relay 门禁体系
local_enabled = false          # local claude 后端总开关（关掉则下面两个 *_backend 一律无效）
local_allowed_for = ["self", "l3"]   # 预留；self 通路尚未接线（run_self 目前无调用方）
# tier → 后端。relay=走 /tasks 门禁体系（审批/追问/冲突检测齐全）；
# local=本机 claude「只读编排」，可用 Task 委派 subagent（如十一智能体），但禁写
# 禁执行禁联网、cwd 锁 security.l2_sandbox_dir，需落地时自动升级 relay（升级不降级）。
# 改 local 的前置：local_enabled=true 且 l2_sandbox_dir 非空并真实存在
#（sandbox 为空时 policy 强制回落 relay，绝不让 local 后端裸奔）。
# 代价：local 通路无 relay 的 task_id，故不支持门禁审批/冲突检测/中途取消。
l2_backend = "relay"           # L1/L2（含动态白名单）
super_backend = "relay"        # super；走 local 时同样只读编排，**不用** bypassPermissions

[claude]
# tier → claude 权限映射（修 fenshen P0：L2 不再 bypassPermissions）
permission_mode_super = "bypassPermissions"
permission_mode_l2 = "default"
l2_allowed_tools = ["Read", "Glob", "Grep", "LS"]
# local 只读编排专用约束（*_backend=local 时改用这两项，与上面 relay 侧的互不干扰）：
# 白名单必须含 Task 才能委派 subagent；禁写禁执行禁联网必须齐全。
local_orchestrate_tools = ["Read", "Glob", "Grep", "LS", "Task"]
local_orchestrate_disallowed = "Bash Write Edit MultiEdit WebFetch WebSearch"
permission_mode_l3 = "manual"
l3_permission_prompts = "none"
l3_disallowed_tools = "Bash Write Edit MultiEdit WebFetch WebSearch"
session_ttl_sec = 3600
reply_timeout_sec = 600        # local 执行看门狗（超时 kill）

[security]
l2_lockdown = true             # L2 沙箱：禁 Bash（relay 后端）；cwd 限制见 l2_sandbox_dir
l2_sandbox_dir = "/mnt/vol-eltaah12/workspace/shared/work"
l2_add_dirs = []               # local 后端额外只读目录：subagent 要读 Agents/G-Skills/
                               # Z-Skills/knowledge 时必须在此给出，否则规格与知识读不到
                               #（sandbox 只是 cwd，兄弟目录不会自动可达）
# local 通路作用域写：非空即开启，只放开列出的目录、只出 HTML/MD/CSV 等**文本件**。
# 机制经 claude 实测：文件写权限只认 Edit(//绝对路径/**) 作用域规则（裸 Write/Edit
# 放 --allowedTools 不生效），配 --permission-prompts none 时越界写**自动拒绝**
# （fail-closed）。开启后 policy.py 自动从 local_orchestrate_disallowed 摘除
# Write/Edit，**Bash 始终禁用**——故 pptx/docx/xlsx 等需跑 python 的件由
# needs_bash_backend 前置判定直接送 relay 门禁，不进 local 空转。
# **刻意不给** knowledge/Agents/G-Skills/Z-Skills/memory/data/templates/secrets/mcp：
# memory 会自动并入每个任务的 CLAUDE.md（改它＝向所有后续任务注入提示词）、
# data 是经营数据入站真源（可写＝能伪造后续报告引用的"真实数据"）、
# Agents/*-Skills 是机队行为定义。这些一律只读，要改走 relay 门禁。
#
# ⚠ 本项与下面的 local_sandbox_rw 是**两层不同的作用域**，别混：
#   local_write_dirs = claude 的 Edit/Write 工具作用域 **且** ```send_file``` 代投
#                      作用域（main.py 的 _consume_send_markers 直接读这一项）。
#   local_sandbox_rw = 内核可写白名单（Bash 放开后由它管辖）。
# 两者耦合决定了 local_write_dirs **不能随意放宽**：放宽到 shared/data 会让
# send_file 能取任意 sender 目录的件外发，破坏 L3 发件人隔离。要放宽内核可写范围
# 请改 local_sandbox_rw，不要改这一项。
# 实际可写范围 = 两者交集：Bash 禁用时（阶段一）等于 local_write_dirs；
# Bash 放开后（阶段二）等于 local_sandbox_rw。
local_write_dirs = []
# local 通路**可删**目录（```delete_file``` 标记的作用域）。刻意比 local_write_dirs
# 更窄：只给草稿区 shared/work。shared/report 是正式交付区、local 又不做 baseline
# 快照，删了不可追溯，故不开放——要删交付件走 relay 门禁（那边有 baseline +
# 冲突检测 + 审批）。留空＝local 完全无删除能力（agent 请求删件会被拒并留审计）。
local_delete_dirs = []
# ── local 内核沙箱 ─────────────────────────────────────────────────────
# **机队默认应开启**。为什么必须有：relay-avatar.service 无任何沙箱指令且以 root
# 运行（relay.service 则有 ProtectSystem=strict + InaccessiblePaths），local 侧一旦
# 没有内核边界就只剩 claude 的**词法**权限规则，而它实测可被绕过：
#   · Bash 命令黑名单 `Bash(rm:*)`：7 种删除手法放过 4 种（python3 -c os.remove /
#     find -delete / 写脚本再 bash 执行 / 重定向截断）
#   · 路径 deny 规则：cat/base64/awk/符号链接/../ 穿越能拦，但 perl -e、node -e、
#     dd if= 全部绕过，且能**写入**"受保护"目录（PWNED.txt 落盘成功）
# 黑名单要成立必须有「所有访问必经」的检查点。relay 侧是 _shared_path() 做 realpath
# 比对（代码解析路径，故绕不过）；local 开了 Bash 就没有任何中介，只有内核 mount
# namespace 能充当（syscall 必经）。同一份路径名单实测：应用层 6 拦 5 绕，内核层 7/7 全拦。
#
# 机制：exec_local 用 systemd-run --pipe --collect 起瞬态 unit。三个实测坑：
#   · 必须瞬态 **service** 不能用 --scope（scope 施加沙箱属性报 Unknown assignment）
#   · 路径列表要写在**同一条** -p 赋值内、空格分隔、每条带 `-` 前缀；拆成多条 -p
#     只保留最后一条，隐藏会静默失效
#   · HOME 必须显式传且指向 .cchome——/root/.claude.json 被遮成*空文件*（非 ENOENT）
#     会让 claude 报 "JSON Parse error: Unexpected EOF" 拒绝启动
#   · 超时看门狗必须 systemctl kill --kill-who=all；只 proc.kill() 杀的是 systemd-run
#     客户端，unit 内进程变孤儿且会持有输出管道把调用方阻塞到超时
# fail-closed：本项为 true 而 systemd-run/systemctl 缺失、或下面两个列表任一为空 →
# ExecLocal.available() 返回 False，路由整体改投 relay 门禁，**绝不降级成无沙箱 local**。
local_sandbox = true
# 内核可写白名单（ProtectSystem=strict 下，未列出的一切**只读**）。
# 下面是机队标准布局；.cchome 必须在内（claude 的 HOME 与 CLAUDE_CONFIG_DIR）。
# **刻意不给**：avatar/（policy.toml 与 state.json——agent 不能改自己的策略）、
# index/（台账与 store-task.env，只读即可连库）、tools/ venv*/（可执行代码与环境，
# 可写＝持久化任意代码执行）、_sync/ tmp/ secrets/。
local_sandbox_rw = [
  "/tmp",
  "/var/tmp",
  "/mnt/vol-eltaah12/workspace/avatar/.cchome",
  "/mnt/vol-eltaah12/workspace/shared/work",
  "/mnt/vol-eltaah12/workspace/shared/report",
  "/mnt/vol-eltaah12/workspace/shared/skills",
  "/mnt/vol-eltaah12/workspace/shared/skills-proposed",
  "/mnt/vol-eltaah12/workspace/shared/G-Skills",
  "/mnt/vol-eltaah12/workspace/shared/Z-Skills",
  "/mnt/vol-eltaah12/workspace/shared/Agents",
  "/mnt/vol-eltaah12/workspace/shared/knowledge",
  "/mnt/vol-eltaah12/workspace/shared/templates",
  "/mnt/vol-eltaah12/workspace/shared/models",
  "/mnt/vol-eltaah12/workspace/shared/mcp",
  "/mnt/vol-eltaah12/workspace/shared/memory",
  "/mnt/vol-eltaah12/workspace/shared/data",
]
# 内核层隐藏黑名单：遮成空文件/空目录，**任何命令形式都读不到**（不是词法拦截，是
# 路径在该 mount namespace 内根本不可解析）。与 relay.service 的 InaccessiblePaths
# 同一套，另加 shared/secrets（relay 侧靠 ProtectSystem 只读兜住，local 侧必须显式
# 隐藏，因为 secrets 在 workspace 下、而 workspace 需要部分可写）。
local_sandbox_hide = [
  "/mnt/vol-eltaah12/workspace/relay.env",
  "/mnt/vol-eltaah12/workspace/shared/secrets",
  "/root/.ssh",
  "/root/.git-credentials",
  "/root/.config/gh",
  "/root/.claude",
  "/root/.claude.json",
  "/root/.claude-proxy",
]
profile_enforce = "strict"     # strict=dws_profile 配置后所有调用强制带，缺失硬告警拒发
sanitize = "on"                # 注入清洗，不可关（代码忽略 off 值）
rate_limit_daily_tasks = 9999  # 每用户日任务数上限（机队默认等同不限；收紧改小即可）
reprompt_cooldown_sec = 60     # 门禁无关消息重提示冷却
bot_blocklist = ["D6HiivKJyPkiSb9viioeCjdOYw7qeNMb75Gt",   # 「AI助理」（曾与分身互刷死循环）
                 "D8YACgStfKBdniisB5xLrLu2EyEI8kX7NU",   # 「原油AI研究院」bot（2026-09-23 互刷事故）
                 "D8YACgStfKBfFEEsPWgvYYtiSa1ViiXKETw"]  # 「预警提醒」系统号（只进不出）
media_max_size_mb = 20
media_allowed_ext = [".txt", ".md", ".csv", ".json", ".log", ".yaml", ".yml",
                     ".docx", ".doc", ".pdf", ".xlsx", ".xls", ".pptx", ".ppt",
                     ".png", ".jpg", ".jpeg", ".gif", ".m4a", ".mp3", ".wav",
                     ".mp4", ".zip", ".tar", ".gz"]

[store]
root = "/mnt/vol-eltaah12/workspace/shared"   # store 存储根（=RELAY_SHARED 同址）
cli = "/usr/local/bin/store"
least_privilege = true         # 强制走 index/store-task.env 的 store_task 角色；禁读 relay.env 与 /proc/*/environ
staging_fallback = true        # DB 不可达：先落 run/staging 暂存并回执，恢复后补登记（不静默绕过）

[knowledge]
local_dir = "/mnt/vol-eltaah12/workspace/shared/knowledge"
wiki_enabled = false           # jingboWiki 权威源检索+升格双写（凭据走 shared/secrets/jingbowiki.env，
                               # 宿主级文件，非 relay.env；启用前置 true）
wiki_env = "/mnt/vol-eltaah12/workspace/shared/secrets/jingbowiki.env"
wiki_kb_id = ""                # 留空=取 jingbowiki.env 的 JINGBOWIKI_KB_ID
recall_max_files = 6
recall_char_budget = 3000
domains = ""                     # 知识域白名单（逗号分隔，可空）。空=自动发现 local_dir 下
                                 # 子目录 ∪ 内置兜底域（口径方法论/组织制度/工具运维/外部资料）；
                                 # 仅在需要补充「尚未建目录」的新域时才填。域清单不硬编码，
                                 # 封装件新增域后无需改代码。「学 N <域>」遇非法域直接报错并
                                 # 回话可选域清单，不静默改归默认域（避免知识落错域无感知）。

[group_watch]
enabled = false                # P4：群监控采集/提炼全链路；开启需显式改本文件+评审
retention_days = 30

[monitor]
heartbeat_sec = 30
probe_interval_sec = 300
dashboard_enabled = true
dashboard_port = 8791          # .35 独立端口（87xx 段：8787 relay/8788 TLS/8790 proxy/8791 avatar）
alert_to = "18434"             # critical 告警接收人（王洪彬）
alert_repeat_hours = 6         # 同一持续异常最多每 6h 重提
