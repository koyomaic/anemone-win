# 鲁大师重点用户名单（日度使用分析报告第 4 节用）
#
# ⚠ 模板原文写「17 人」，但全盘无该名单定义（T760 排查已确认）。
#   本文件是按可追溯出处重建的真实名单，共 12 人。若业务方另有 17 人原始名单，
#   直接追加 [[user]] 块即可，报告会自动按实际人数算活跃率（N/M），不写死 17。
#
# 出处（source 字段）：
#   policy_owner       = policy.toml 的 owner_userid
#   static_whitelist   = policy.toml 的 whitelist（永久有效）
#   dynamic_grant      = run/whitelist_dynamic.json（grant_valid_days=90 会过期）
#   historical_active  = audit.log 里出现过的真实发起人
#
# org/dept/title 由 dws contact user get 反查（2026-10-12），非手抄。
# 反查不到的留空并注记，不编造。

